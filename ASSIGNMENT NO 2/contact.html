
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Chai Junction</title>
    <link rel="stylesheet" href="contact.css">
    <script src="contact.js" defer></script>
</head>
<body>

<header>
    <h1>Chai Junction</h1>
    <p>Your Daily Dose of Chai</p>
    <nav>
        <a href="index.html">Home</a>
        <a href="media.html">Menu</a>
        <a href="register.html">Register</a>
        <a href="services.html">Services</a>
        <a href="portfolio.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <section class="contact-intro">
        <h2>Contact Us</h2>
        <p>Have a question or want to place an order? Send us a message.</p>
    </section>

    <section class="contact-container">
        <div class="contact-info">
            <h3>Get in Touch</h3>
            <p><strong>Brand:</strong> Chai Junction</p>
            <p><strong>Email:</strong> chaijunction@gmail.com</p>
            <p><strong>Hours:</strong> Daily, 1 PM – 4 AM</p>
           
        </div>

        <form id="contactForm" class="contact-form">
            <label for="customerName">Your Name</label>
            <input type="text" id="customerName" required>

            <label for="customerEmail">Your Email</label>
            <input type="email" id="customerEmail" required>

            <label for="subject">Subject</label>
            <select id="subject" required>
                <option value="">Choose a subject</option>
                <option value="Menu enquiry">Menu enquiry</option>
                <option value="Order enquiry">Order enquiry</option>
                <option value="Table reservation">Table reservation</option>
                <option value="Feedback">Feedback</option>
            </select>

            <label for="message">Your Message</label>
            <textarea id="message" rows="5" required></textarea>

            <button type="submit">Send via WhatsApp</button>
            <p id="formMessage" aria-live="polite"></p>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Chai Junction. All rights reserved.</p>
</footer>

</body>
</html>
