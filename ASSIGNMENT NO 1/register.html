<main class="register-container">
    <form class="register-form" onsubmit="alert('Registration demo completed!'); return false;">
        <h2>Create Your Account</h2>
        <p>Join the Chai Junction family.</p>

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" minlength="6" required>

        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Confirm your password" minlength="6" required>

        <label class="terms">
            <input type="checkbox" required>
            I agree to the terms and conditions.
        </label>

        <button type="submit">Register Now</button>
    </form>
</main>
